<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0B0D1E"/>
<title>⚡ WORD CLAW</title>
<link rel="manifest" href="manifest.json"/>
<style>
:root{
  --bg:#0B0D1E;--c1:#141629;--c2:#1B1E3A;--bd:#252840;
  --pur:#7B7FE8;--pink:#FF4B8C;--teal:#4ECDC4;--amb:#FFB830;--mut:#7A88BB;
  --gold:#FFD700;--green:#4CAF50;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden;}
#root{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;}
input,select,button{font-family:inherit;}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px var(--c1) inset;-webkit-text-fill-color:#fff;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;}

/* animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes clawDrop{0%{transform:translateY(0)}40%{transform:translateY(78px)}72%{transform:translateY(78px)}100%{transform:translateY(0)}}
@keyframes capPop{from{transform:scale(0) rotate(-15deg);opacity:0}70%{transform:scale(1.15) rotate(2deg)}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
@keyframes correctFlash{0%,100%{background:var(--c1)}50%{background:rgba(76,175,80,.15)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes streakBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

.fade-up{animation:fadeUp .35s ease-out both;}
.pop-in{animation:pop .3s ease-out both;}
.slide-in{animation:slideIn .28s ease-out both;}
.pulse{animation:pulse 1.1s infinite;}
.float-anim{animation:float 2.5s ease-in-out infinite;}
.claw-drop{animation:clawDrop 2.6s ease-in-out forwards;}
.cap-pop{animation:capPop .55s ease-out forwards;}
.correct-flash{animation:correctFlash .4s ease-out;}
.wrong-shake{animation:wrongShake .38s ease-out;}

/* common */
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:12px;transition:transform .12s,opacity .12s;}
.btn:active{transform:scale(.96);opacity:.85;}
.btn-primary{background:linear-gradient(135deg,var(--pur),#5550BB);color:#fff;}
.btn-pink{background:linear-gradient(135deg,var(--pink),#9B30D0);color:#fff;}
.btn-teal{background:linear-gradient(135deg,var(--teal),#2A9D8F);color:#fff;}
.btn-kakao{background:#FEE500;color:#3A2C00;}
.btn-full{width:100%;padding:14px;font-size:15px;}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:8px;}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:14px;}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.input-field{width:100%;background:var(--c1);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;outline:none;transition:border-color .2s;}
.input-field:focus{border-color:var(--pur);}
.input-field::placeholder{color:var(--mut);}
.prog-track{height:7px;background:var(--c2);border-radius:4px;overflow:hidden;}
.prog-bar{height:100%;border-radius:4px;transition:width .6s ease;}
.section-label{font-size:10px;font-weight:700;color:var(--mut);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;}

/* top bar */
.topbar{padding:10px 16px 9px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);background:var(--bg);flex-shrink:0;position:relative;z-index:5;}
.logo-text{font-size:16px;font-weight:900;background:linear-gradient(90deg,var(--pur),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px;}
.back-btn{width:30px;height:30px;border-radius:8px;background:var(--c2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--pur);font-size:14px;flex-shrink:0;}
.topbar-title{font-size:15px;font-weight:800;color:#fff;flex:1;}
.topbar-right{font-size:12px;color:var(--mut);}

/* screen */
.screen-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.screen-content{padding:14px 14px 90px;}

/* navbar */
.navbar{background:var(--c1);border-top:1px solid var(--bd);display:flex;padding:5px 0 max(6px,env(safe-area-inset-bottom));flex-shrink:0;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;border:none;background:none;position:relative;}
.nav-icon{font-size:20px;line-height:1;}
.nav-lbl{font-size:9px;font-weight:600;}
.nav-active{color:var(--pur);}
.nav-inactive{color:#3A3E60;}
.nav-dot{width:6px;height:6px;background:var(--pink);border-radius:50%;position:absolute;top:2px;right:calc(50% - 14px);}

/* loading spinner */
.spinner{width:20px;height:20px;border:2px solid var(--bd);border-top-color:var(--pur);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;}

/* divider */
.divider{display:flex;align-items:center;gap:10px;margin:4px 0;}
.divider-line{flex:1;height:1px;background:var(--bd);}
.divider-text{font-size:11px;color:var(--mut);}
</style>
</head>

const sh=a=>[...a].sort(()=>Math.random()-.5);
const getTier=(cnt,avg)=>{for(let i=TIERS.length-1;i>=0;i--){if(cnt>=TIERS[i].words&&avg>=TIERS[i].score)return TIERS[i];}return null;};
const getNextTier=(cur)=>{const i=cur?TIERS.indexOf(cur):-1;return TIERS[i+1]||null;};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const fmtDate=d=>new Date(d).toLocaleDateString('ko-KR',{month:'short',day:'numeric'});

/* ─────────── QUIZ GENERATOR ─────────── */
const QTYPES=['meaning','word','spelling','sentence_blank','sentence_meaning'];
function blankWord(w){
  const l=w.split('');const n=Math.max(2,Math.floor(l.length*.45));
  const idx=new Set();while(idx.size<n){const i=1+Math.floor(Math.random()*(l.length-2));idx.add(i);}
  return l.map((c,i)=>idx.has(i)?'_':c).join('');
}
function makeQ(word,forceType){
  const type=forceType||QTYPES[Math.floor(Math.random()*QTYPES.length)];
  const wrong=sh(WORDS.filter(x=>x.id!==word.id)).slice(0,3);
  switch(type){
    case'meaning':return{type,label:'의미 고르기',lc:'#7B7FE8',
      prompt:`"${word.w}"의 뜻은?`,sub:word.p,
      opts:sh([...wrong.map(w=>({v:w.m,ok:false})),{v:word.m,ok:true}]),
      answer:word.m,word};
    case'word':return{type,label:'단어 고르기',lc:'#4ECDC4',
      prompt:`"${word.m}"를 영어로 쓰면?`,sub:word.p,
      opts:sh([...wrong.map(w=>({v:w.w,ok:false})),{v:word.w,ok:true}]),
      answer:word.w,word};
    case'spelling':{const bl=blankWord(word.w);return{type,label:'스펠링 완성',lc:'#FFB830',
      prompt:'빈칸을 채워 단어를 완성하세요',sub:`뜻: ${word.m}`,big:bl,
      opts:sh([...wrong.map(w=>({v:w.w,ok:false})),{v:word.w,ok:true}]),
      answer:word.w,word};}
    case'sentence_blank':{const rgx=new RegExp('\\b'+word.w+'\\b','i');
      const bl=rgx.test(word.e)?word.e.replace(rgx,'_____'):word.e.replace(word.w,'_____');
      return{type,label:'문장 빈칸',lc:'#FF4B8C',
        prompt:'빈칸에 알맞은 단어를 고르세요',big:bl,sub:word.k,
        opts:sh([...wrong.map(w=>({v:w.w,ok:false})),{v:word.w,ok:true}]),
        answer:word.w,word};}
    case'sentence_meaning':return{type,label:'문장 해석',lc:'#8BC34A',
      prompt:'다음 문장의 뜻을 고르세요',big:word.e,
      opts:sh([...wrong.map(w=>({v:w.k,ok:false})),{v:word.k,ok:true}]),
      answer:word.k,word};
    default:return makeQ(word,'meaning');
  }
}

/* ─────────── CLAUDE API ─────────── */
async function callClaude(prompt,max=300){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:max,
      messages:[{role:'user',content:prompt}]})
  });
  const d=await res.json();
  return d.content?.[0]?.text||'';
}

              <div style={{fontSize:17,fontWeight:800,color:'var(--pink)',marginTop:2}}>{mission.reward?.icon} {mission.reward?.label}</div>

        <div className="card fade-up" style={{marginBottom:12,animationDelay:'.1s'}}>
          <div style={{marginBottom:6}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:4}}><span style={{color:'var(--mut)'}}>단어 숙달</span><span style={{fontWeight:700,color:nextTier.c}}>{mastered.size} / {nextTier.words}</span></div>
            <ProgBar val={mastered.size} max={nextTier.words} color={nextTier.c}/>
          </div>
          <div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:4}}><span style={{color:'var(--mut)'}}>정확도</span><span style={{fontWeight:700,color:nextTier.c}}>{avg}% / {nextTier.score}%</span></div>
            <ProgBar val={avg} max={nextTier.score} color={nextTier.c}/>
          </div>
          <div style={{fontSize:11,color:'var(--mut)',marginTop:8}}>{nextTier.words-mastered.size}단어 + 정확도 {nextTier.score}% 이상 필요 · 보상: {nextTier.reward}</div>
          <div style={{display:'flex',gap:5,marginTop:10}}>
            {TIERS.map(t=>{const done=curTier&&TIERS.indexOf(t)<=TIERS.indexOf(curTier);return<div key={t.id} style={{flex:1,padding:'4px 2px',borderRadius:7,border:`1px solid ${t.c}44`,background:`${t.c}${done?'22':'0a'}`,textAlign:'center',fontSize:9,fontWeight:700,color:done?t.c:'#3A3E60'}}>{t.id}{done?' ✓':''}</div>;})}
          </div>
        </div>

      {/* 주간 차트 */}
      <div className="section-label">이번 주 학습</div>
      <div className="card fade-up" style={{marginBottom:12,animationDelay:'.15s'}}>
        <div style={{display:'flex',gap:4,alignItems:'flex-end',height:52,marginBottom:6}}>

              <div style={{width:'100%',height:v?Math.round(v/100*42):3,background:v>0?(i===6?'var(--pur)':'var(--pur)'):'var(--bd)',borderRadius:'3px 3px 0 0',opacity:v>0?.85+i*.02:.3}}/>
              <div style={{fontSize:9,color:'var(--mut)'}}>{days[i]}</div>

          ))}

        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--mut)'}}>
          <span>주간 평균 88%</span><span style={{cursor:'pointer',color:'var(--pur)'}}>부모님 리포트 전송 →</span>
        </div>
      </div>

      {/* 빠른 액션 */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}} className="fade-up" style={{animationDelay:'.2s'}}>
        <Btn ch="📝 학습 시작" onClick={()=>setTab('study')} cls="btn-primary" style={{padding:14,fontSize:14,borderRadius:12}}/>
        <Btn ch="🎯 미션 현황" onClick={()=>setTab('mission')} cls="btn-teal" style={{padding:14,fontSize:14,borderRadius:12}}/>

    {/* 보상 선택 모달 */}

        <div style={{fontSize:16,fontWeight:800,marginBottom:4}}>보상 선택</div>
        <div style={{fontSize:12,color:'var(--mut)',marginBottom:14}}>오늘 달성하고 싶은 보상을 선택하세요</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
          {REWARDS.map(r=>(
            <div key={r.id} onClick={()=>setSelReward(r)} style={{background:selReward?.id===r.id?'rgba(255,75,140,.15)':'var(--c2)',border:`2px solid ${selReward?.id===r.id?'var(--pink)':'var(--bd)'}`,borderRadius:12,padding:12,cursor:'pointer',transition:'all .18s'}}>
              <div style={{fontSize:22,marginBottom:5}}>{r.icon}</div>
              <div style={{fontSize:12,fontWeight:700}}>{r.label}</div>
              <div style={{fontSize:10,color:'var(--mut)',marginTop:3}}>필요: {r.tier}</div>
            </div>
          ))}

        <Btn ch="💬 카카오톡으로 승인 요청 전송" onClick={sendApproval} dis={!selReward} cls="btn-pink btn-full" style={{marginBottom:8}}/>
        <Btn ch="취소" onClick={()=>setShowRewards(false)} style={{width:'100%',background:'transparent',color:'var(--mut)',padding:10,fontSize:13,border:'none',cursor:'pointer'}}/>
      </div>
    </div>}
  </div>;
}

/* ─────────── STUDY SCREEN ─────────── */
function StudyScreen({state,setState}){
  const {mastered,setMastered,reviewPool,setReviewPool,totalQ,totalCorrect,setTotalQ,setTotalCorrect}=state;
  const [mode,setMode]=useState('flash'); // flash | quiz
  const [pending,setPending]=useState(()=>sh(WORDS));
  const [currentWord,setCurrentWord]=useState(null);
  const [isReview,setIsReview]=useState(false);
  const [flipped,setFlipped]=useState(false);
  const [q,setQ]=useState(null);
  const [sel,setSel]=useState(null);
  const [answered,setAnswered]=useState(false);
  const [streak,setStreak]=useState(0);
  const [animKey,setAnimKey]=useState(0);
  const [resultAnim,setResultAnim]=useState('');
  const [aiText,setAiText]=useState('');
  const [aiLoading,setAiLoading]=useState(false);

  const pickNext=useCallback(()=>{
    const rp=reviewPool;
    let word,rev=false;
    if(rp.size>0&&Math.random()<.38){
      const arr=[...rp];word=WORDS.find(w=>w.id===arr[Math.floor(Math.random()*arr.length)]);rev=true;
    }else if(pending.length>0){word=pending[0];
    }else if(rp.size>0){const arr=[...rp];word=WORDS.find(w=>w.id===arr[0]);rev=true;
    }else{word=WORDS[Math.floor(Math.random()*WORDS.length)];}
    setCurrentWord(word);setIsReview(rev);
    if(mode==='quiz')setQ(makeQ(word));
    setFlipped(false);setSel(null);setAnswered(false);setAiText('');
    setAnimKey(k=>k+1);setResultAnim('');
  },[pending,reviewPool,mode]);

  useEffect(()=>{pickNext();},[mode]);

  const handleAnswer=opt=>{
    if(answered)return;
    const ok=opt.ok;
    setSel(opt.v);setAnswered(true);
    const nq=totalQ+1,nc=ok?totalCorrect+1:totalCorrect;
    setTotalQ(nq);if(ok)setTotalCorrect(nc);
    S.set('totalQ',nq);S.set('totalCorrect',ok?nc:totalCorrect);
    setStreak(ok?s=>s+1:0);
    setResultAnim(ok?'correct-flash':'wrong-shake');
    if(ok){
      const nm=new Set([...mastered,currentWord.id]);setMastered(nm);S.set('mastered',[...nm]);
      if(isReview){const nr=new Set(reviewPool);nr.delete(currentWord.id);setReviewPool(nr);S.set('reviewPool',[...nr]);}
      else setPending(p=>p.filter(w=>w.id!==currentWord.id));
    }else{
      if(!isReview)setPending(p=>p.filter(w=>w.id!==currentWord.id));
      if(!reviewPool.has(currentWord.id)){const nr=new Set(reviewPool);nr.add(currentWord.id);setReviewPool(nr);S.set('reviewPool',[...nr]);}
    }
  };

  const cardFlip=()=>{if(!flipped){setFlipped(true);setAnswered(true);}};
  const markCard=ok=>{
    const nq=totalQ+1,nc=ok?totalCorrect+1:totalCorrect;
    setTotalQ(nq);if(ok)setTotalCorrect(nc);
    S.set('totalQ',nq);S.set('totalCorrect',ok?nc:totalCorrect);
    if(ok){const nm=new Set([...mastered,currentWord.id]);setMastered(nm);S.set('mastered',[...nm]);
      if(isReview){const nr=new Set(reviewPool);nr.delete(currentWord.id);setReviewPool(nr);S.set('reviewPool',[...nr]);}
      else setPending(p=>p.filter(w=>w.id!==currentWord.id));
    }else{
      if(!isReview)setPending(p=>p.filter(w=>w.id!==currentWord.id));
      if(!reviewPool.has(currentWord.id)){const nr=new Set(reviewPool);nr.add(currentWord.id);setReviewPool(nr);S.set('reviewPool',[...nr]);}
    }
    pickNext();
  };

  const getAI=async()=>{
    if(!currentWord)return;
    setAiLoading(true);setAiText('');
    const text=await callClaude(`Create a simple English example sentence (max 10 words) using "${currentWord.w}" (meaning: ${currentWord.m}) for a Korean middle school student. Then give the Korean translation.\nFormat:\nENG: [sentence]\nKOR: [translation]`,150);
    setAiText(text);setAiLoading(false);
  };

  const avg=pct(totalCorrect,totalQ);

  if(!currentWord)return<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;

  return<div style={{flex:1,display:'flex',flexDirection:'column'}}>
    {/* mode tabs */}
    <div style={{display:'flex',gap:0,borderBottom:'1px solid var(--bd)',flexShrink:0}}>
      {[{id:'flash',label:'📖 플래시카드'},{id:'quiz',label:'❓ 퀴즈'}].map(m=>(
        <button key={m.id} onClick={()=>{setMode(m.id);}} style={{flex:1,padding:'10px 0',border:'none',background:'none',color:mode===m.id?'var(--pur)':'var(--mut)',fontWeight:mode===m.id?700:400,fontSize:13,cursor:'pointer',borderBottom:mode===m.id?'2px solid var(--pur)':'none',fontFamily:'inherit'}}>{m.label}</button>
      ))}
    </div>

    {/* stats strip */}
    <div style={{display:'flex',gap:8,padding:'10px 14px',borderBottom:'1px solid var(--bd)',flexShrink:0}}>
      <div style={{flex:1,background:'var(--c2)',borderRadius:8,padding:'6px 8px',textAlign:'center'}}>
        <div style={{fontSize:15,fontWeight:800,color:'var(--pur)'}}>{mastered.size}</div>
        <div style={{fontSize:9,color:'var(--mut)'}}>숙달</div>
      </div>
      <div style={{flex:1,background:'var(--c2)',borderRadius:8,padding:'6px 8px',textAlign:'center'}}>
        <div style={{fontSize:15,fontWeight:800,color:'var(--pink)'}}>{reviewPool.size}</div>
        <div style={{fontSize:9,color:'var(--mut)'}}>복습대기</div>
      </div>
      <div style={{flex:1,background:'var(--c2)',borderRadius:8,padding:'6px 8px',textAlign:'center'}}>
        <div style={{fontSize:15,fontWeight:800,color:avg>=85?'var(--teal)':avg>=65?'var(--pur)':'var(--pink)'}}>{avg}%</div>
        <div style={{fontSize:9,color:'var(--mut)'}}>정확도</div>
      </div>
      {streak>=3&&<div style={{flex:1,background:'rgba(255,184,48,.15)',border:'1px solid rgba(255,184,48,.3)',borderRadius:8,padding:'6px 8px',textAlign:'center'}}>
        <div style={{fontSize:15,fontWeight:800,color:'var(--amb)'}}>🔥{streak}</div>
        <div style={{fontSize:9,color:'var(--mut)'}}>연속</div>
      </div>}
    </div>

    {reviewPool.size>0&&<div style={{margin:'8px 14px 0',padding:'7px 12px',background:'rgba(255,75,140,.12)',border:'1px solid rgba(255,75,140,.3)',borderRadius:8,display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
      <div style={{width:6,height:6,borderRadius:'50%',background:'var(--pink)',flexShrink:0}}/>
      <span style={{fontSize:11,color:'var(--pink)',fontWeight:700}}>복습 단어 {reviewPool.size}개 · 틀린 단어가 랜덤으로 재출제됩니다</span>
    </div>}

    <div className="screen-scroll">
      <div style={{padding:'12px 14px 90px'}}>
        {mode==='flash'?(
          <div key={animKey} className="slide-in">
            {isReview&&<div style={{marginBottom:8,display:'flex',alignItems:'center',gap:5}}><span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:20,background:'rgba(255,75,140,.15)',color:'var(--pink)',border:'1px solid rgba(255,75,140,.3)'}}>🔁 복습</span></div>}
            {/* card */}
            <div onClick={cardFlip} style={{cursor:'pointer',background:flipped?'linear-gradient(145deg,#1A2A50,#1B1E3A)':'var(--c1)',border:`2px solid ${flipped?'rgba(123,127,232,.5)':'var(--bd)'}`,borderRadius:20,padding:'28px 20px',minHeight:200,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center',gap:8,transition:'all .3s',boxShadow:flipped?'0 0 30px rgba(123,127,232,.15)':'none',marginBottom:12}}>
              {!flipped?(
                <>
                  <div style={{fontSize:11,color:'var(--mut)',letterSpacing:3,textTransform:'uppercase'}}>{currentWord.p}</div>
                  <div style={{fontSize:38,fontWeight:900,letterSpacing:-1,color:'#fff'}}>{currentWord.w}</div>
                  <div style={{fontSize:10,color:'var(--mut)',background:'var(--c2)',padding:'4px 12px',borderRadius:20,marginTop:4}}>탭하여 뜻 확인</div>
                </>
              ):(
                <>
                  <div style={{fontSize:11,color:'var(--pur)',letterSpacing:2}}>한국어 뜻</div>
                  <div style={{fontSize:34,fontWeight:900,color:'var(--teal)'}}>{currentWord.m}</div>
                  <div style={{fontSize:12,color:'var(--mut)',background:'var(--c2)',padding:'8px 14px',borderRadius:10,lineHeight:1.6,marginTop:4}}>
                    <span style={{color:'var(--teal)',fontWeight:700}}>{currentWord.w}</span>: {currentWord.e}
                    <div style={{color:'var(--mut)',marginTop:4,fontSize:11}}>{currentWord.k}</div>
                  </div>
                </>
              )}
            </div>
            {/* AI button */}
            <div style={{background:'rgba(123,127,232,.1)',border:'1px solid rgba(123,127,232,.3)',borderRadius:10,padding:'8px 12px',display:'flex',alignItems:'center',gap:8,marginBottom:10,cursor:'pointer'}} onClick={getAI}>
              <span style={{fontSize:14}}>✨</span>
              <span style={{fontSize:12,color:'var(--mut)',flex:1}}>{aiLoading?'AI 예문 생성 중...':'AI 맞춤 예문 생성하기 (Claude)'}</span>
              {!aiLoading&&<button style={{fontSize:10,fontWeight:700,padding:'3px 10px',borderRadius:6,background:'var(--pur)',color:'#fff',border:'none',cursor:'pointer'}}>생성</button>}
              {aiLoading&&<div className="spinner" style={{width:14,height:14,borderWidth:1.5}}/>}
            </div>
            {aiText&&<div style={{background:'rgba(123,127,232,.12)',border:'1px solid rgba(123,127,232,.3)',borderRadius:12,padding:14,fontSize:13,lineHeight:1.8,marginBottom:12}}>
              {aiText.split('\n').filter(Boolean).map((ln,i)=><div key={i} style={{color:ln.startsWith('ENG')?'#E0E8FF':'var(--teal)'}}>{ln}</div>)}
            </div>}
            {/* action buttons */}
            {flipped&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
              <Btn ch="다시 볼게" onClick={()=>markCard(false)} style={{padding:'12px 4px',borderRadius:10,background:'rgba(255,75,140,.15)',color:'var(--pink)',border:'1px solid rgba(255,75,140,.4)',fontSize:12}}/>
              <Btn ch="어려워" onClick={()=>markCard(false)} style={{padding:'12px 4px',borderRadius:10,background:'rgba(255,184,48,.15)',color:'var(--amb)',border:'1px solid rgba(255,184,48,.4)',fontSize:12}}/>
              <Btn ch="알아! ✓" onClick={()=>markCard(true)} style={{padding:'12px 4px',borderRadius:10,background:'rgba(76,175,80,.15)',color:'var(--green)',border:'1px solid rgba(76,175,80,.4)',fontSize:12}}/>
            </div>}
          </div>
        ):(
          q&&<div key={animKey} className={`slide-in ${resultAnim}`}>
            {/* quiz type badge */}
            <div style={{marginBottom:8}}>
              <span style={{fontSize:10,fontWeight:700,padding:'3px 10px',borderRadius:20,background:`${q.lc}22`,color:q.lc,border:`1px solid ${q.lc}44`}}>{q.label}</span>
              {isReview&&<span style={{fontSize:10,fontWeight:700,padding:'3px 10px',borderRadius:20,background:'rgba(255,75,140,.15)',color:'var(--pink)',border:'1px solid rgba(255,75,140,.3)',marginLeft:6}}>🔁 복습</span>}
            </div>
            {/* question card */}
            <div style={{background:'var(--c1)',border:'1px solid var(--bd)',borderRadius:16,padding:'20px 16px',textAlign:'center',marginBottom:12}}>
              <div style={{fontSize:12,color:'var(--mut)',marginBottom:8}}>{q.prompt}</div>
              {q.big&&<div style={{fontSize:q.type==='spelling'?28:16,fontWeight:q.type==='spelling'?900:700,color:q.type==='spelling'?'var(--amb)':'#E8EEFF',lineHeight:1.5,letterSpacing:q.type==='spelling'?5:0,background:q.type==='spelling'?'rgba(255,184,48,.1)':'none',padding:q.type==='spelling'?'10px 14px':'0',borderRadius:q.type==='spelling'?10:0,border:q.type==='spelling'?'1px solid rgba(255,184,48,.3)':'none',marginBottom:6}}>{q.big}</div>}
              {q.sub&&<div style={{fontSize:11,color:q.type==='sentence_blank'?'var(--teal)':'var(--mut)',marginTop:4}}>{q.sub}</div>}
              {!q.big&&<><div style={{fontSize:11,color:'var(--mut)',letterSpacing:3,marginBottom:6}}>{q.word.p}</div><div style={{fontSize:34,fontWeight:900,color:'#fff'}}>{q.word.w}</div></>}
            </div>
            {/* options */}
            <div style={{display:'grid',gridTemplateColumns:q.type==='sentence_meaning'?'1fr':'1fr 1fr',gap:8,marginBottom:12}}>
              {q.opts.map((opt,i)=>{
                let bg='var(--c1)',bc='var(--bd)',col='#fff',op=1;
                if(answered){
                  if(opt.ok){bg='rgba(76,175,80,.2)';bc='var(--green)';col='var(--green)';}
                  else if(opt.v===sel&&!opt.ok){bg='rgba(255,75,140,.2)';bc='var(--pink)';col='var(--pink)';}
                  else op=.4;
                }
                return<button key={i} onClick={()=>handleAnswer(opt)} style={{background:bg,border:`2px solid ${bc}`,color:col,borderRadius:11,padding:q.type==='sentence_meaning'?'13px 12px':'16px 8px',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit',transition:'all .15s',opacity:op,lineHeight:1.4,textAlign:'center'}}>{opt.v}</button>;
              })}
            </div>
            {/* result */}
            {answered&&<>
              <div style={{background:sel===q.answer?'rgba(76,175,80,.12)':'rgba(255,75,140,.12)',border:`1px solid ${sel===q.answer?'rgba(76,175,80,.3)':'rgba(255,75,140,.3)'}`,borderRadius:10,padding:'8px 12px',textAlign:'center',marginBottom:10}}>
                <div style={{fontSize:14,fontWeight:700,color:sel===q.answer?'var(--green)':'var(--pink)'}}>{sel===q.answer?'🎉 정답!':'😅 오답'}</div>
                {sel!==q.answer&&<div style={{fontSize:11,color:'var(--mut)',marginTop:3}}>정답: <span style={{color:'#fff',fontWeight:700}}>{q.answer}</span> · 🔁 복습 목록에 추가됨</div>}
              </div>
              <Btn ch="다음 문제 →" onClick={pickNext} cls="btn-primary btn-full"/>
            </>}
          </div>
        )}
      </div>
    </div>
  </div>;
}

/* ─────────── MISSION SCREEN ─────────── */
function MissionScreen({state}){
  const {mastered,totalQ,totalCorrect,mission,setMission}=state;

      <button className="back-btn" onClick={onBack} style={{background:'#EEEDFE',color:'#534AB7'}}>←</button>
      <div style={{flex:1,marginLeft:10,fontSize:14,fontWeight:800,color:'#1A1C2E'}}>부모 대시보드</div>
      <span style={{fontSize:10,fontWeight:700,padding:'2px 9px',borderRadius:20,background:'#EEEDFE',color:'#3C3489',border:'1px solid #CECBF6'}}>부모 계정</span>
    </div>
    <div style={{flex:1,overflowY:'auto',padding:'14px 14px 30px'}}>
      {/* 자녀 프로필 */}
      <div style={{background:'#fff',border:'1px solid #E0E2EF',borderRadius:14,padding:14,marginBottom:10,display:'flex',alignItems:'center',gap:12}}>
        <div style={{width:44,height:44,borderRadius:'50%',background:'linear-gradient(135deg,#7B7FE8,#FF4B8C)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:800,color:'#fff',flexShrink:0}}>학생</div>
        <div style={{flex:1}}>
          <div style={{fontSize:16,fontWeight:800,color:'#1A1C2E'}}>내 자녀</div>
          <div style={{fontSize:11,color:'#6B70A8',marginTop:2}}>중학교 2학년 · 오늘 학습 중</div>
        </div>
        {curTier&&<span style={{fontSize:12,fontWeight:800,padding:'3px 10px',borderRadius:20,background:'#EEEDFE',color:'#3C3489',border:'1px solid #CECBF6'}}>{curTier.id}</span>}
      </div>

      {/* 오늘 성과 */}
      <div style={{background:'#fff',border:'1px solid #E0E2EF',borderRadius:14,padding:14,marginBottom:10}}>
        <div style={{fontSize:10,fontWeight:700,color:'#8B90B8',letterSpacing:1,marginBottom:10}}>오늘의 학습 성과</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:12}}>
          {[{l:'숙달 단어',v:mastered.size+'개',c:'#534AB7'},{l:'정확도',v:avg+'%',c:'#0F6E56'},{l:'문제 수',v:totalQ+'문제',c:'#854F0B'}].map(s=>(
            <div key={s.l} style={{background:'#F5F6FA',borderRadius:10,padding:'8px',textAlign:'center'}}>
              <div style={{fontSize:18,fontWeight:800,color:s.c}}>{s.v}</div>
              <div style={{fontSize:9,color:'#8B90B8',marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{fontSize:10,fontWeight:700,color:'#8B90B8',marginBottom:6}}>LEGEND 달성까지</div>
        <div style={{marginBottom:5}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,marginBottom:3,color:'#6B70A8'}}><span>단어 숙달</span><span style={{fontWeight:700}}>{mastered.size}/80</span></div>
          <div style={{height:6,background:'#EEEDFE',borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',width:Math.min(pct(mastered.size,80),100)+'%',background:'#7F77DD',borderRadius:3}}/></div>
        </div>
        <div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,marginBottom:3,color:'#6B70A8'}}><span>정확도</span><span style={{fontWeight:700}}>{avg}%/95%</span></div>
          <div style={{height:6,background:'#EEEDFE',borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',width:Math.min(pct(avg,95),100)+'%',background:'#7F77DD',borderRadius:3,opacity:.7}}/></div>
        </div>
      </div>

      {/* 보상 승인 요청 */}
      {mission?.status==='pending'&&<div style={{background:'#fff',border:'2px solid #EF9F27',borderRadius:14,padding:14,marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:'#EF9F27'}}/>
          <span style={{fontSize:11,fontWeight:700,color:'#854F0B'}}>보상 승인 요청이 도착했어요</span>
        </div>
        <div style={{fontSize:14,fontWeight:800,color:'#1A1C2E',marginBottom:4}}>GOLD 등급 달성</div>
        <div style={{fontSize:11,color:'#6B70A8',marginBottom:10,lineHeight:1.5}}>단어 {mastered.size}개 숙달 · 정확도 {avg}%<br/>약속된 보상 지급을 승인해주세요</div>
        <div style={{background:'#FAEEDA',border:'1px solid #FAC775',borderRadius:10,padding:'10px 12px',marginBottom:10,display:'flex',alignItems:'center',gap:10}}>
          <div style={{fontSize:22,width:36,height:36,background:'#fff',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{mission.reward?.icon}</div>
          <div>
            <div style={{fontSize:13,fontWeight:800,color:'#412402'}}>{mission.reward?.label}</div>
            <div style={{fontSize:10,color:'#854F0B',marginTop:2}}>약속된 보상</div>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <button onClick={approve} style={{padding:10,borderRadius:10,border:'none',cursor:'pointer',fontSize:12,fontWeight:800,background:'#4CAF50',color:'#fff',fontFamily:'inherit'}}>✓ 승인하기</button>
          <button style={{padding:10,borderRadius:10,border:'1px solid #E0E2EF',cursor:'pointer',fontSize:12,fontWeight:700,background:'#fff',color:'#6B70A8',fontFamily:'inherit'}}>협의하기</button>
        </div>
      </div>}

      {mission?.status==='approved'&&<div style={{background:'rgba(76,175,80,.1)',border:'1px solid rgba(76,175,80,.3)',borderRadius:14,padding:14,marginBottom:10,textAlign:'center'}}>
        <div style={{fontSize:18,marginBottom:4}}>✅</div>
        <div style={{fontSize:13,fontWeight:700,color:'#2e7d32'}}>보상 승인 완료!</div>
        <div style={{fontSize:11,color:'#6B70A8',marginTop:4}}>{mission.reward?.label} 지급 승인됨</div>
      </div>}
    </div>
  </div>;
}

/* ─────────── MAIN APP ─────────── */
const TABS=[{id:'home',l:'홈',i:'🏠'},{id:'study',l:'학습',i:'📝'},{id:'mission',l:'미션',i:'🎯'},{id:'claw',l:'클로',i:'🎮'},{id:'review',l:'AI리뷰',i:'🧠'}];

function MainApp({user,onLogout}){
  const [tab,setTab]=useState('home');
  const [showParent,setShowParent]=useState(false);
  const [mission,setMission]=useState(()=>S.get('mission',{status:'idle'}));

  const masteredArr=S.get('mastered',[]);
  const [mastered,setMastered]=useState(new Set(masteredArr));
  const [reviewPool,setReviewPool]=useState(new Set(S.get('reviewPool',[])));
  const [totalQ,setTotalQ]=useState(()=>S.get('totalQ',0));
  const [totalCorrect,setTotalCorrect]=useState(()=>S.get('totalCorrect',0));

  const avg=pct(totalCorrect,totalQ);
  const curTier=getTier(mastered.size,avg);

  const state={mastered,setMastered,reviewPool,setReviewPool,totalQ,setTotalQ,totalCorrect,setTotalCorrect,mission,setMission};

  if(showParent)return<div style={{flex:1,display:'flex',flexDirection:'column'}}><ParentView state={state} onBack={()=>setShowParent(false)}/></div>;

  return<>
    {/* Top bar */}
    <div className="topbar">
      <div className="logo-text">⚡ WORD CLAW</div>
      <div style={{flex:1}}/>
      {curTier&&<span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:20,background:`${curTier.c}22`,color:curTier.c,border:`1px solid ${curTier.c}44`,marginRight:6}}>{curTier.id}</span>}
      <button onClick={()=>setShowParent(true)} style={{fontSize:10,fontWeight:700,padding:'3px 10px',borderRadius:20,background:'rgba(254,229,0,.15)',color:'#9B7A00',border:'1px solid rgba(254,229,0,.4)',cursor:'pointer',fontFamily:'inherit'}}>👨‍👩‍👧 부모</button>
      <button onClick={()=>setTab('settings')} style={{marginLeft:8,width:30,height:30,borderRadius:8,background:'var(--c2)',border:'none',cursor:'pointer',fontSize:16}}>⚙</button>
    </div>

    {/* Content */}
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {tab==='home'&&<Dashboard state={state} setState={()=>{}} setTab={setTab}/>}
      {tab==='study'&&<StudyScreen state={state} setState={()=>{}}/>}
      {tab==='mission'&&<MissionScreen state={state}/>}
      {tab==='claw'&&<ClawScreen state={state}/>}
      {tab==='review'&&<AIReviewScreen state={state}/>}
      {tab==='settings'&&<SettingsScreen user={user} onLogout={onLogout}/>}
    </div>

    {/* Bottom nav */}
    <div className="navbar">
      {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={'nav-item '+(tab===t.id?'nav-active':'nav-inactive')}>
        <span className="nav-icon">{t.i}</span>
        <span className="nav-lbl">{t.l}</span>
        {t.id==='claw'&&mission?.status==='approved'&&<span className="nav-dot"/>}
      </button>)}
    </div>
  </>;
}

/* ─────────── ROOT ─────────── */
function App(){
  const [screen,setScreen]=useState('splash');
  const [user,setUser]=useState(()=>S.get('user',null));

  useEffect(()=>{
    if(user){setScreen('app');}else{setTimeout(()=>setScreen('auth'),1800);}
  },[]);

  const handleLogin=u=>{const usr={...u,name:u.name||u.email?.split('@')[0]||'사용자'};setUser(usr);S.set('user',usr);setScreen('app');};
  const handleLogout=()=>{setUser(null);S.set('user',null);setScreen('auth');};

  return<div style={{display:'flex',flexDirection:'column',height:'100%',position:'relative'}}>
    {screen==='splash'&&<SplashScreen onNext={()=>setScreen(user?'app':'auth')}/>}
    {screen==='auth'&&<AuthScreen onLogin={()=>setScreen('login')} onSignup={()=>setScreen('signup')}/>}
    {screen==='login'&&<LoginScreen onBack={()=>setScreen('auth')} onLogin={handleLogin}/>}
    {screen==='signup'&&<SignupScreen onBack={()=>setScreen('auth')} onSignup={handleLogin}/>}
    {screen==='app'&&user&&<MainApp user={user} onLogout={handleLogout}/>}
  </div>;
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
